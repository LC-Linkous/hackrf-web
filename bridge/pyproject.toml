[project]
name = "hackrf-web"
version = "0.1.0"
description = "Local bridge for hackrf-web: drives a HackRF One through hackrfpy and serves spectrum frames to the browser page over a loopback WebSocket."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-2.0-only" }
authors = [{ name = "Lauren Linkous" }]
dependencies = [
    "numpy>=1.26",
    "websockets>=12",
    "hackrfpy>=1.1",
]

[project.scripts]
hackrf-web = "hackrf_web.cli:main"

[project.urls]
Homepage = "https://lc-linkous.github.io/hackrf-web/"
Repository = "https://github.com/LC-Linkous/hackrf-web"
Protocol = "https://github.com/LC-Linkous/hackrf-web/blob/main/PROTOCOL.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hackrf_web"]
# the page is copied into src/hackrf_web/web/ by `python -m build` via the
# sync script in the repo root (see README → Releasing); it is served at GET /
