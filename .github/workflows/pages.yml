name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Stage site (web/ plus the rendered docs)
        run: |
          mkdir -p _site
          cp -r web/. _site/
          pip install -q markdown
          python tools-render-docs.py _site
      - name: Stamp last-updated date from the commit
        run: |
          D=$(git log -1 --format=%cs)
          sed -i "s|<time id=\"updated\" datetime=\"[0-9-]*\">[0-9-]*</time>|<time id=\"updated\" datetime=\"$D\">$D</time>|" _site/index.html
          grep -o '<time id="updated"[^<]*</time>' _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
